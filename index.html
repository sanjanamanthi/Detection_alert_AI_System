<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Intrusion Detection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 0.95em;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-panel {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        .video-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            background: rgba(0,0,0,0.7);
            color: white;
        }

        .status-badge.active {
            background: #10b981;
        }

        .status-badge.inactive {
            background: #ef4444;
        }

        .control-panel {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .panel-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-start {
            background: #10b981;
            color: white;
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            width: 100%;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
            width: 100%;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-panel {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-card {
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
        }

        .info-card h3 {
            font-size: 0.85em;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .info-card p {
            font-size: 1.4em;
            font-weight: bold;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #3b82f6;
        }

        .section-divider {
            height: 2px;
            background: linear-gradient(to right, transparent, #667eea, transparent);
            margin: 20px 0;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 Human Intrusion Detection System</h1>
            <p>Real-time monitoring for college ground areas during class hours</p>
        </div>

        <div class="main-grid">
            <div class="video-panel">
                <h2 class="panel-title">📹 Live Camera Feed</h2>
                <div class="video-container">
                    <img id="videoFeed" src="/video_feed" alt="Loading camera feed...">
                    <div id="statusBadge" class="status-badge inactive">INACTIVE</div>
                </div>
            </div>

            <div class="control-panel">
                <h2 class="panel-title">⚙️ Control Panel</h2>
                
                <div id="alertContainer"></div>

                <div class="form-group">
                    <label>Class Start Time</label>
                    <input type="time" id="startTime" value="09:00">
                </div>

                <div class="form-group">
                    <label>Class End Time</label>
                    <input type="time" id="endTime" value="17:00">
                </div>

                <div class="form-group">
                    <label>Confidence Threshold</label>
                    <input type="number" id="confidence" value="0.5" min="0.1" max="1" step="0.1">
                </div>

                <div class="form-group">
                    <label>Alert Cooldown (seconds)</label>
                    <input type="number" id="cooldown" value="60" min="10" max="300" step="10">
                </div>

                <button class="btn btn-primary" onclick="saveConfig()">💾 Save Configuration</button>

                <div class="section-divider"></div>

                <div class="form-group">
                    <label>Telegram Bot Token</label>
                    <input type="text" id="telegramToken" placeholder="Enter bot token">
                </div>

                <div class="form-group">
                    <label>Telegram Chat ID</label>
                    <input type="text" id="telegramChatId" placeholder="Enter chat ID">
                </div>

                <button class="btn btn-secondary" onclick="testTelegram()">📱 Test Telegram</button>

                <div class="section-divider"></div>

                <div class="button-group">
                    <button class="btn btn-start" onclick="startMonitoring()">▶️ Start</button>
                    <button class="btn btn-stop" onclick="stopMonitoring()">⏹️ Stop</button>
                </div>
            </div>
        </div>

        <div class="info-panel">
            <h2 class="panel-title">📊 System Status</h2>
            <div class="info-grid">
                <div class="info-card">
                    <h3>Current Time</h3>
                    <p id="currentTime">--:--:--</p>
                </div>
                <div class="info-card">
                    <h3>Monitoring Status</h3>
                    <p id="monitoringStatus">Inactive</p>
                </div>
                <div class="info-card">
                    <h3>Within Hours</h3>
                    <p id="withinHours">No</p>
                </div>
                <div class="info-card">
                    <h3>Active Window</h3>
                    <p id="activeWindow">--:-- to --:--</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                
                document.getElementById('startTime').value = config.start_time;
                document.getElementById('endTime').value = config.end_time;
                document.getElementById('telegramToken').value = config.telegram_token || '';
                document.getElementById('telegramChatId').value = config.telegram_chat_id || '';
                document.getElementById('confidence').value = config.confidence_threshold;
                document.getElementById('cooldown').value = config.alert_cooldown;
            } catch (error) {
                console.error('Error loading config:', error);
            }
        }

        async function saveConfig() {
            try {
                const config = {
                    start_time: document.getElementById('startTime').value,
                    end_time: document.getElementById('endTime').value,
                    telegram_token: document.getElementById('telegramToken').value,
                    telegram_chat_id: document.getElementById('telegramChatId').value,
                    confidence_threshold: parseFloat(document.getElementById('confidence').value),
                    alert_cooldown: parseInt(document.getElementById('cooldown').value)
                };

                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });

                const result = await response.json();
                if (result.status === 'success') {
                    showAlert('Configuration saved successfully!', 'success');
                    updateStatus();
                } else {
                    showAlert('Failed to save configuration', 'error');
                }
            } catch (error) {
                showAlert('Error saving configuration: ' + error.message, 'error');
            }
        }

        async function startMonitoring() {
            try {
                const response = await fetch('/api/start', { method: 'POST' });
                const result = await response.json();
                
                if (result.status === 'success') {
                    showAlert('Monitoring started successfully!', 'success');
                    updateStatus();
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (error) {
                showAlert('Error starting monitoring: ' + error.message, 'error');
            }
        }

        async function stopMonitoring() {
            try {
                const response = await fetch('/api/stop', { method: 'POST' });
                const result = await response.json();
                
                if (result.status === 'success') {
                    showAlert('Monitoring stopped', 'info');
                    updateStatus();
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (error) {
                showAlert('Error stopping monitoring: ' + error.message, 'error');
            }
        }

        async function testTelegram() {
            try {
                const response = await fetch('/api/test_telegram', { method: 'POST' });
                const result = await response.json();
                
                if (result.status === 'success') {
                    showAlert('Test alert sent successfully! Check Telegram.', 'success');
                } else {
                    showAlert('Failed to send test alert: ' + result.message, 'error');
                }
            } catch (error) {
                showAlert('Error testing Telegram: ' + error.message, 'error');
            }
        }

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                
                document.getElementById('currentTime').textContent = status.current_time;
                document.getElementById('monitoringStatus').textContent = 
                    status.monitoring_active ? 'Active' : 'Inactive';
                document.getElementById('withinHours').textContent = 
                    status.within_hours ? 'Yes' : 'No';
                document.getElementById('activeWindow').textContent = 
                    `${status.start_time} to ${status.end_time}`;
                
                const badge = document.getElementById('statusBadge');
                if (status.monitoring_active && status.within_hours) {
                    badge.textContent = 'ACTIVE';
                    badge.className = 'status-badge active';
                } else {
                    badge.textContent = 'INACTIVE';
                    badge.className = 'status-badge inactive';
                }
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            loadConfig();
            updateStatus();
            
            // Update status every 2 seconds
            setInterval(updateStatus, 2000);
        });
    </script>
</body>
</html>
